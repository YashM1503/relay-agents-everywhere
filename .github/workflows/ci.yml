name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_RELAY_APP_MODE: production
          NEXT_PUBLIC_DEMO_MODE: "false"

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t relay:ci .

      - name: Smoke test container
        run: |
          docker run -d --name relay-ci -p 3000:3000 \
            -e RELAY_APP_MODE=production \
            relay:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              curl -sf http://127.0.0.1:3000/ >/dev/null
              docker rm -f relay-ci
              exit 0
            fi
            sleep 2
          done
          docker logs relay-ci
          docker rm -f relay-ci
          exit 1
